spring:
  application:
    name: instafide
  config:
    import: "configserver:"
  cloud:
    config:
#      enabled: false  # Disables the entire Config Client mechanism.
      fail-fast: true
      uri: http://localhost:8888
      request-connect-timeout: 5000
      request-read-timeout: 5000
      retry:
        max-attempts: 6
        multiplier: 1.1
        initial-interval: 1000
        max-interval: 1000

#spring.cloud.config.enabled=false or 
#spring.cloud.config.import-check.enabled=false.
