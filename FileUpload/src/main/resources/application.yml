spring:
  application:
    name: fileupload
  config:
    import: "configserver:"
  cloud:
    config:
      fail-fast: true
      uri: http://localhost:8888
      request-connect-timeout: 5000
      request-read-timeout: 5000
      retry:
        max-attempts: 6
        multiplier: 1.1
        initial-interval: 1000
        max-interval: 1000

#:configserver:http://localhost:8888

#spring.cloud.config.enabled=false or 
#Sspring.cloud.config.import-check.enabled=false.